<!doctype html><html><head><meta charset="utf-8"><title>Orbital</title><link rel="stylesheet" href="/demo/slides.css"></head>
<body><div class="center">
  <img src="/assets/capy-astronaut.svg" style="width:170px;height:170px" alt="">
  <h1 style="font-size:64px">Orbital</h1>
  <div class="sub">Free satellite data → verified science, around the clock</div>
  <div class="big">
    <div class="card"><div class="k">Lake Mead vs USBR gauge (Pearson r)</div><div class="v" id="water">…</div></div>
    <div class="card"><div class="k">Tartar Fire vs official perimeter (IoU)</div><div class="v" id="fire">…</div></div>
  </div>
  <div class="crew">
    <figure><img src="/assets/capy-director.svg" alt=""></figure><figure><img src="/assets/capy-water.svg" alt=""></figure>
    <figure><img src="/assets/capy-fire.svg" alt=""></figure><figure><img src="/assets/capy-reviewer.svg" alt=""></figure>
    <figure><img src="/assets/capy-auditor.svg" alt=""></figure>
  </div>
</div>
<div class="foot">Muse Spark Open (open weights) · Sentinel-2 open data (Copernicus) · github.com/chinesepowered/hack-metam</div>
<script>
const span = (a, b) => `${a}<span class="arrow">→</span><span style="color:var(--good)">${b}</span>`;
fetch("/api/study/lake-mead" + location.search).then(r => r.json()).then(s => {
  const r = s.versions.map(v => v.grade.pearson_r);
  document.getElementById("water").innerHTML = span(r[0].toFixed(2), r[r.length - 1].toFixed(2));
});
fetch("/api/fires" + location.search).then(r => r.json()).then(f => {
  const v = (f["tartar-id"] || {versions: []}).versions.filter(x => !x.key.includes("recompute"));
  if (v.length) document.getElementById("fire").innerHTML = span(v[0].measurement.iou.toFixed(2), v[v.length - 1].measurement.iou.toFixed(2));
});
</script></body></html>

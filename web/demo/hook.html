<!doctype html><html><head><meta charset="utf-8"><title>Lake Mead from orbit</title><link rel="stylesheet" href="/demo/slides.css">
<style>video{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#000}
.tag{position:absolute;top:28px;left:34px;background:rgba(5,12,24,.75);padding:14px 20px;border-radius:14px}
.tag b{font-size:30px}.tag div{color:var(--muted);font-size:18px;margin-top:4px}</style></head>
<body><video id="v" autoplay muted playsinline loop></video>
<div class="tag"><b>Lake Mead, from orbit</b><div>Sentinel-2 · one clear scene per month · water measured by the Water Lab</div></div>
<script>
fetch("/api/study/lake-mead").then(r => r.json()).then(s => {
  const v = s.versions[s.versions.length - 1];
  document.getElementById("v").src = v.timelapse;
});
</script></body></html>

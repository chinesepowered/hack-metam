<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Capy the capybara">
  <ellipse cx="100" cy="186" rx="58" ry="7" fill="#000" opacity=".12"/>
  <!-- body -->
  <path d="M42 150 C40 118 70 104 100 104 C132 104 162 118 160 152 C159 174 140 182 100 182 C60 182 43 172 42 150 Z"
        fill="#B27A4E" stroke="#7A4E2E" stroke-width="3" stroke-linejoin="round"/>
  <path d="M70 160 C72 146 86 140 100 140 C114 140 128 146 130 160 C126 172 112 176 100 176 C88 176 74 172 70 160 Z"
        fill="#D3A47A" opacity=".55"/>
  <!-- feet -->
  <rect x="58" y="170" width="22" height="14" rx="7" fill="#7A4E2E"/>
  <rect x="120" y="170" width="22" height="14" rx="7" fill="#7A4E2E"/>
  <!-- ears: small, set high on the corners like a real capybara -->
  <ellipse cx="62" cy="47" rx="8" ry="6.5" fill="#7A4E2E" transform="rotate(-20 62 47)"/>
  <ellipse cx="138" cy="47" rx="8" ry="6.5" fill="#7A4E2E" transform="rotate(20 138 47)"/>
  <ellipse cx="62" cy="48" rx="4" ry="3" fill="#F49A9A" opacity=".7" transform="rotate(-20 62 48)"/>
  <ellipse cx="138" cy="48" rx="4" ry="3" fill="#F49A9A" opacity=".7" transform="rotate(20 138 48)"/>
  <!-- head: boxy, a little wider at the muzzle -->
  <path d="M58 62 C58 46 76 40 100 40 C124 40 142 46 142 62 L146 108 C147 128 128 138 100 138 C72 138 53 128 54 108 Z"
        fill="#B27A4E" stroke="#7A4E2E" stroke-width="3" stroke-linejoin="round"/>
  <!-- big flat muzzle -->
  <path d="M62 100 C62 86 78 82 100 82 C122 82 138 86 138 100 L138 112 C138 126 122 132 100 132 C78 132 62 126 62 112 Z"
        fill="#D3A47A"/>
  <path d="M100 82 L100 92" stroke="#7A4E2E" stroke-width="2" stroke-linecap="round" opacity=".35"/>
  <ellipse cx="86" cy="96" rx="5" ry="3.2" fill="#2E1C12" transform="rotate(-12 86 96)"/>
  <ellipse cx="114" cy="96" rx="5" ry="3.2" fill="#2E1C12" transform="rotate(12 114 96)"/>
  <path d="M91 113 Q95.5 118.5 100 113 Q104.5 118.5 109 113" fill="none" stroke="#2E1C12" stroke-width="2.4" stroke-linecap="round"/>
  <!-- cheeks -->
  <ellipse cx="62" cy="96" rx="8" ry="5.5" fill="#F49A9A" opacity=".6"/>
  <ellipse cx="138" cy="96" rx="8" ry="5.5" fill="#F49A9A" opacity=".6"/>
  <!-- eyes: small and high, with the famous relaxed half-lid -->
  <g class="eyes">
    <ellipse cx="78" cy="68" rx="5" ry="5.5" fill="#2E1C12"/>
    <ellipse cx="122" cy="68" rx="5" ry="5.5" fill="#2E1C12"/>
    <circle cx="79.8" cy="67.5" r="1.6" fill="#fff"/>
    <circle cx="123.8" cy="67.5" r="1.6" fill="#fff"/>
    <path d="M72 64.5 Q78 61 84 64.5 L84 62 Q78 59.5 72 62 Z" fill="#B27A4E"/>
    <path d="M116 64.5 Q122 61 128 64.5 L128 62 Q122 59.5 116 62 Z" fill="#B27A4E"/>
    <path d="M72 64.5 Q78 61 84 64.5 M116 64.5 Q122 61 128 64.5" fill="none" stroke="#7A4E2E" stroke-width="1.8" stroke-linecap="round"/>
  </g>

  <path d="M58 52 C72 47 128 47 142 52" fill="none" stroke="#1E6FB8" stroke-width="5" stroke-linecap="round"/>
  <circle cx="85" cy="49" r="9.5" fill="#7DD3FC" stroke="#1E6FB8" stroke-width="3.5"/>
  <circle cx="115" cy="49" r="9.5" fill="#7DD3FC" stroke="#1E6FB8" stroke-width="3.5"/>
  <circle cx="82" cy="46" r="3" fill="#fff" opacity=".85"/>
  <circle cx="112" cy="46" r="3" fill="#fff" opacity=".85"/>
  <path d="M100 150 C94 160 94 166 100 168 C106 166 106 160 100 150 Z" fill="#38BDF8" stroke="#1E6FB8" stroke-width="2"/>
</svg>
